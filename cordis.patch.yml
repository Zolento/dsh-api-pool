# dsh-api-pool bundle patch.
#
# Insert the host plugin; the browser half is discovered from package.json's
# `dsh.client`.
#
# The pool's provider route is NOT declared here: a profile that configures
# `llm-pi-ai` supplies its own `providers` object in a later layer, and a patch
# entry's config subtree is replaced rather than merged, so a bundle-declared
# route would be clobbered. The host plugin publishes the route through the
# `llm-pi-ai` settings namespace instead (idempotently, see src/provider.js).
- insert:
    - id: dsh-api-pool
      name: dsh-api-pool
